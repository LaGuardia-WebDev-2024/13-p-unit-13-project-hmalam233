<html>

  <body>
    <h1>Quiz About [Me]
      
      
      
    <hr />
      
    <style> 
      
      h1:hover {
        background-color: rgb(43, 114, 152 );

    <!-- Movie Question -->
    <form id="movie-form">
      <label>
        🎥 What is my favorite tv show?
        <select id="movie-answer">
          <option value="movie1">suits</option>
          <option value="movie2">how to get away with murder</option>
          <option value="movie3">Lincoln lawyer</option>
          <option value="movie4">The rookie</option>
        </select>
      </label>
      <button type="submit">Check Movie Answer</button>
    </form>
    <div id="movie-result">
    <p id="suits">
      
      </p>
    
        
   <img src= https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Heart_coraz%C3%B3n.svg/800px-Heart_coraz%C3%B3n.svg.png width="150">

      <img id="htgawm" width="100" height= "200">
      </div>
    <hr />
    <!-- Book Question -->
    <form id="book-form">
      <label>
        📖 What is my favorite book?
        <select id="book-answer">
          <option value="book1">The Inheritence games</option>
          <option value="book2">The Hunger Games</option>
          <option value="book3">Kindred</option>
          <option value="book4">Allegidly</option>

      <button type="submit">Check Book Answer</button>
    </form>
    <div id="book-result"></div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      //Movie Question jQuery Code
      $("#movie-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#movie-answer");
        var answer = $answer.val();

        if (answer === "movie2") {
          $("#suits").text("Correct!");
          $("#htgawm").attr("src","https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcTh_Bsh1uP1r0LNDvrfGedFWZo78J0fSlkao9Frj8x4QreYyaKrtlse6iST8J8Jwa2Xx2oMwQ")
        } else {
          $("#suits").text("ermm terribly wrong bro-");
        }
      });

      //Book Question jQuery Code
      $("#book-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#book-answer");
        var answer = $answer.val();

        if (answer === "book3") {
          $("#book-result").text("Correct!");
        } else {
          $("#book-result").text("Your not trying are you..");
        }
      });
      
       
 
      
    </script>
